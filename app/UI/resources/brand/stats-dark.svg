<svg width="1240" height="128" viewBox="0 0 1240 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="143 security checks - 19 attack-chain detectors - 6,237 automated tests - 0 dependencies - 0 network calls">
  <title>143 security checks - 19 attack-chain detectors - 6,237 automated tests - 0 dependencies - 0 network calls</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, "DejaVu Sans", Helvetica, Arial, sans-serif; }
    .card { opacity: 0; animation: rise .65s cubic-bezier(.2,.7,.3,1) forwards; }
    .c0 { animation-delay: 0.00s; }
    .c1 { animation-delay: 0.08s; }
    .c2 { animation-delay: 0.16s; }
    .c3 { animation-delay: 0.24s; }
    .c4 { animation-delay: 0.32s; }
    .num { font-weight: 800; font-size: 36px; animation: glow 2.8s ease-in-out infinite; }
    .c0 .num { animation-delay: 0.00s; }
    .c1 .num { animation-delay: 0.35s; }
    .c2 .num { animation-delay: 0.70s; }
    .c3 .num { animation-delay: 1.05s; }
    .c4 .num { animation-delay: 1.40s; }
    .icon { font-size: 24px; }
    .label { font-size: 15px; fill: #8b949e; letter-spacing: .3px; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 0px transparent); } 50% { filter: drop-shadow(0 0 7px); } }
    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; opacity: 1; }
      .num { animation: none; }
      .scan { display: none; }
    }
  </style>

 
  <rect x="60" y="118" width="1120" height="2" rx="1" fill="#30363d" opacity=".55"/>
